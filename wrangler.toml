name = "curio"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "curio"
database_id = "a5b9ad19-9090-4150-b34b-1877858bf85f"
migrations_dir = "migrations"

# Small refresh slices every 15 minutes; each creator is rechecked about every 4 hours.
[triggers]
crons = ["*/15 * * * *"]
