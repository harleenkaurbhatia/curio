name = "curio"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "curio"
database_id = "REPLACE_AFTER_wrangler_d1_create"
migrations_dir = "migrations"

# Refresh every 4 hours so news stays fresh across the day.
[triggers]
crons = ["0 */4 * * *"]
